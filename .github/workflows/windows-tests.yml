name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    name: Windows tests (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86
            runner: windows-2025-vs2026
          - architecture: x64
            runner: windows-2025-vs2026
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build and run tests
        shell: pwsh
        run: ./win/tests/run-tests.ps1 -Architecture ${{ matrix.architecture }}
